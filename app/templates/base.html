<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⛏</span>
      <span class="brand-name">{{ app_name }}</span>
      <span class="brand-ver">v{{ app_version }}</span>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a href="/" class="{{ 'active' if title == 'Dashboard' else '' }}">📊 Dashboard</a>
      <a href="/servers" class="{{ 'active' if title == 'Servers' else '' }}">🖥 Servers</a>
      <a href="/backups" class="{{ 'active' if title == 'Backups' else '' }}">💾 Backups</a>
      <a href="/system" class="{{ 'active' if title == 'System' else '' }}">⚙ System</a>
    </nav>

    <main class="content">
      <h1 class="page-title">{{ title }}</h1>
      {% set msg = request.query_params.get('msg') %}
      {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/static/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
