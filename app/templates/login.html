<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="card login-card">
      <div class="login-brand">
        <span class="logo">⛏</span>
        <span class="brand-name">{{ app_name }}</span>
        <span class="brand-ver">v{{ app_version }}</span>
      </div>
      <h1 class="login-title">Administrator sign in</h1>

      {% if error %}<div class="errors">{{ error }}</div>{% endif %}

      <form method="post" action="/login" class="login-form">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="field">
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" autofocus required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn primary login-submit">Sign in</button>
      </form>
    </div>
    <p class="login-foot muted">
      No HTTPS in v0.1.2 — use only on a trusted LAN or behind a VPN.
    </p>
  </div>
</body>
</html>
